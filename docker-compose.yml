version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: visulingo-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: vocab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d vocab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
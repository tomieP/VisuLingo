<svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vl-cam-body" x1="8" y1="8" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FCD34D" />
      <stop offset="45%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
    <linearGradient id="vl-shutter" x1="36" y1="4" x2="46" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
    <radialGradient id="vl-lens-depth" cx="38%" cy="38%" r="65%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </radialGradient>
  </defs>

  <!-- Camera Shutter Button -->
  <rect x="36" y="4" width="10" height="6" rx="3" fill="url(#vl-shutter)" />

  <!-- Friendly Camera Body with Speech Bubble Tail -->
  <path d="M17 9C9.5 9 6 12.5 6 20V37C6 44.5 9.5 48 17 48H19L15 54L25 48H43C50.5 48 54 44.5 54 37V20C54 12.5 50.5 9 43 9H17Z" fill="url(#vl-cam-body)" />

  <!-- Camera Flash -->
  <circle cx="16" cy="18" r="4.5" fill="#0F172A" />
  <circle cx="16" cy="18" r="3" fill="#FDE68A" />
  <circle cx="15.2" cy="17.2" r="1" fill="#FFFFFF" />

  <!-- Big Clear Camera Lens -->
  <circle cx="32" cy="28.5" r="14" fill="url(#vl-lens-depth)" stroke="rgba(255,255,255,0.25)" stroke-width="1.8" />
  <circle cx="32" cy="28.5" r="11" fill="#0B0F17" stroke="rgba(251,191,36,0.3)" stroke-width="1.2" />

  <!-- Glass Arc Reflection -->
  <path d="M24 23.5C26 20.5 30 19 34 19.5" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" />

  <!-- Smiling "V" Iris -->

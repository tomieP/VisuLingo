<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background #0B0F17 matching app theme -->
  <rect width="512" height="512" fill="#0B0F17" />

  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="210" fill="#F59E0B" fill-opacity="0.12" />

  <!-- The Exact VisuLingo Camera scaled and centered (512 canvas, 60x60 SVG scaled by 6.4x to 384x384, offset x=64, y=64) -->
  <g transform="translate(64, 64) scale(6.4)">
    <defs>
      <!-- Friendly Warm Amber & Golden Honey Gradient -->
      <linearGradient id="icon-cam-body" x1="8" y1="8" x2="52" y2="52" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FCD34D" />
        <stop offset="45%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>

      <!-- Shutter Click Button Gradient -->
      <linearGradient id="icon-shutter" x1="36" y1="4" x2="46" y2="10" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="100%" stop-color="#F59E0B" />
      </linearGradient>

      <!-- Deep Glassy Lens Depth -->
      <radialGradient id="icon-lens-depth" cx="38%" cy="38%" r="65%">
        <stop offset="0%" stop-color="#1E293B" />
        <stop offset="50%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#020617" />
      </radialGradient>

      <!-- Friendly Inner Lens Core -->
      <radialGradient id="icon-lens-core" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0" />
      </radialGradient>

      <!-- Glossy Reflection Highlight -->
      <linearGradient id="icon-lens-reflection" x1="22" y1="20" x2="38" y2="34" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>
    </defs>

    <!-- 1. Camera Shutter Button -->
    <rect x="36" y="4" width="10" height="6" rx="3" fill="url(#icon-shutter)" />

    <!-- 2. Camera Body with Integrated Social Speech Bubble Tail -->
    <path
      d="M17 9C9.5 9 6 12.5 6 20V37C6 44.5 9.5 48 17 48H19L15 54L25 48H43C50.5 48 54 44.5 54 37V20C54 12.5 50.5 9 43 9H17Z"
      fill="url(#icon-cam-body)"
    />

    <!-- Frosted Edge Soft Highlight -->
    <path
      d="M17 10C10 10 7 13 7 20V37C7 44 10 47 17 47H19.2L16.2 51.5L23.8 47H43C50 47 53 44 53 37V20C53 13 50 10 43 10H17Z"
      stroke="rgba(255,255,255,0.45)"
      stroke-width="1.2"
      fill="none"
    />

    <!-- 3. Camera Flash -->
    <circle cx="16" cy="18" r="4.5" fill="#0F172A" />
    <circle cx="16" cy="18" r="3" fill="#FDE68A" />
    <circle cx="15.2" cy="17.2" r="1" fill="#FFFFFF" />

    <!-- 4. Big Beautiful Camera Lens -->
    <circle
      cx="32"
      cy="28.5"
      r="14"
      fill="url(#icon-lens-depth)"
      stroke="rgba(255,255,255,0.25)"
      stroke-width="1.8"
    />

    <circle
      cx="32"
      cy="28.5"
      r="11"
      fill="#0B0F17"
      stroke="rgba(251,191,36,0.3)"
      stroke-width="1.2"
    />

    <circle cx="32" cy="28.5" r="9" fill="url(#icon-lens-core)" />

    <!-- Camera Lens Glass Arc Reflection -->
    <path
      d="M24 23.5C26 20.5 30 19 34 19.5"
      stroke="url(#icon-lens-reflection)"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- 5. Smiling "V" -->
    <path
      d="M26.5 27L32 33.5L37.5 27"
      stroke="#FBBF24"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M28.5 28L32 32L35.5 28"
      stroke="#FFFFFF"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.8"
    />

    <!-- 6. Intelligent Sparkle Star -->
    <path
      d="M44 14C44 16.5 45.5 18 48 18C45.5 18 44 19.5 44 22C44 19.5 42.5 18 40 18C42.5 18 44 16.5 44 14Z"
      fill="#FFFFFF"
    />
  </g>
</svg>

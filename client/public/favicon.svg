  <path d="M28.5 28L32 32L35.5 28" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Focus Sparkle -->
  <path d="M44 14C44 16.5 45.5 18 48 18C45.5 18 44 19.5 44 22C44 19.5 42.5 18 40 18C42.5 18 44 16.5 44 14Z" fill="#FFFFFF" />
